<!doctype html>
<html lang="ru">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F3F5F8}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;color:#0F1A2A;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;background:#F3F5F8}
.hdr{flex:none;padding:8px 16px 14px;background:#fff;border-bottom:1px solid #E6EAF0;display:flex;flex-direction:column;gap:10px}
.hdr-row{display:flex;align-items:center;gap:6px;min-height:44px}
.hdr-title{flex:1;font-weight:800;font-size:16px}
.step{font-size:13px;font-weight:700;color:#1F4FB8;background:#EAF0FD;padding:5px 10px;border-radius:999px}
.segs{display:flex;gap:6px}
.seg{flex:1;height:4px;border-radius:2px;background:#DDE3EC}
.seg.on{background:#1F5BD8}
main{flex:1;overflow-y:auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
.ftr{flex:none;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #E6EAF0;display:flex;flex-direction:column;gap:8px}
h1{margin:0;font-size:25px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.h1-big{font-size:30px;line-height:1.15}
.h2{margin:0;font-size:17px;font-weight:800;line-height:1.3}
.sub{margin:6px 0 0;font-size:15px;line-height:1.45;color:#5E6878}
.muted{color:#5E6878}
.col{display:flex;flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g18{gap:18px}
.lbl{font-size:14px;font-weight:700;color:#1B2738}
.req{color:#B3301B}
.inp{display:block;width:100%;height:52px;border:1.5px solid #D3D9E3;border-radius:12px;padding:0 14px;font-size:16px;color:#0F1A2A;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none}
.inp::placeholder{color:#8A93A3}
.inp:focus{border-color:#1F5BD8;box-shadow:0 0 0 3px rgba(31,91,216,.16)}
.inp.bad{border-color:#C2361F;background:#FFF8F6}
.ta{height:132px;padding:12px 14px;line-height:1.45;resize:none}
.err{font-size:13px;font-weight:600;color:#B3301B;line-height:1.35}
.banner-err{display:flex;gap:10px;align-items:flex-start;background:#FDECE8;color:#8F2413;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.4}
.info{display:flex;gap:10px;align-items:flex-start;background:#EAF0FD;color:#1B3A80;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;font-weight:600}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:56px;padding:14px 16px;border:1.5px solid #E0E5ED;border-radius:14px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s;-webkit-tap-highlight-color:transparent}
.opt.on{border-color:#1F5BD8;background:#F1F5FF}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.opt:focus-within{box-shadow:0 0 0 3px rgba(31,91,216,.22)}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #A6B0C0;display:flex;align-items:center;justify-content:center;background:#fff}
.opt.on .radio{border-color:#1F5BD8}
.radio i{display:block;width:10px;height:10px;border-radius:50%;background:#1F5BD8;transform:scale(0);transition:transform .15s}
.opt.on .radio i{transform:scale(1)}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #A6B0C0;display:flex;align-items:center;justify-content:center;background:#fff;color:#fff}
.opt.on .check{background:#1F5BD8;border-color:#1F5BD8}
.check svg{opacity:0}.opt.on .check svg{opacity:1}
.opt-t{font-weight:700;font-size:16px}
.opt-s{font-size:13px;font-weight:600;color:#5E6878}
.time{font-size:15px;font-weight:700;color:#1B2738;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border:0;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
.btn-p{background:#1F5BD8;color:#fff}
.btn-p:active{background:#1A4EBB}
.btn-p:disabled{background:#D5DCE7;color:#5E6878;cursor:not-allowed}
.btn-s{background:transparent;color:#1F4FB8;height:48px}
.iconbtn{flex:none;width:44px;height:44px;margin-left:-10px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#0F1A2A;cursor:pointer}
.card{background:#fff;border-radius:18px;padding:18px;border:1px solid #E6EAF0}
.menu{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:14px 16px;border:1px solid #E6EAF0;border-radius:16px;background:#fff;text-align:left;cursor:pointer;color:#0F1A2A}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:#EAF0FD;color:#1F5BD8;display:flex;align-items:center;justify-content:center}
.ico.grey{background:#EEF1F5;color:#5E6878}
.link{border:0;background:transparent;color:#1F4FB8;font-weight:700;font-size:14px;padding:10px 6px;margin-right:-6px;cursor:pointer;min-height:44px;border-radius:10px}
.k{font-size:13px;color:#5E6878;font-weight:600}
.v{font-size:15px;color:#0F1A2A;font-weight:600;line-height:1.4;white-space:pre-line;word-break:break-word}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;background:#EEF1F5;color:#4A5464}
.chip.on{background:#EAF0FD;color:#1F4FB8}
.chip.ok{background:#E7F5EE;color:#13573A}
.logo{width:44px;height:44px;border-radius:13px;background:#1F5BD8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.03em;flex:none}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.okbanner{display:flex;gap:12px;align-items:flex-start;background:#E7F5EE;border:1px solid #BFE3CF;border-radius:16px;padding:14px 10px 14px 14px}
.okdot{flex:none;width:28px;height:28px;border-radius:50%;background:#1E7F4F;color:#fff;display:flex;align-items:center;justify-content:center}
.terms{border-color:#F1D9A8;background:#FFFBF2}
.terms p{margin:0;font-size:15px;line-height:1.5;font-weight:500}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:40px 12px 0}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid #DDE3EC;border-top-color:#1F5BD8;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   НАСТРОЙКИ — меняются только здесь
   ===================================================================== */
const CONFIG = {
  // Production URL вебхука из n8n (узел «Webhook», вкладка Production URL)
  API_URL: 'https://tanggsuuuu.app.n8n.cloud/webhook/sop-api',
  // Контакты координатора для экрана «Связаться с координатором»
  COORDINATOR: {
    name: '[Имя координатора]',
    telegram: '',          // username без @, например: sop_coordinator
    phone: ''              // например: +7 701 000 00 00
  },
  // true — можно открыть страницу в обычном браузере и пройти анкету без сохранения (для проверки)
  DEV_MODE: false
};

const HOTELS = [
  { id: 'radisson',      name: 'Radisson',                 address: 'Сарыарка 4' },
  { id: 'park_inn',      name: 'Park Inn',                 address: 'Сарыарка 8а' },
  { id: 'hgi',           name: 'Hilton Garden Inn (ХГИ)',  address: 'Кабанбай батыр 15' },
  { id: 'saad',          name: 'SAAD',                     address: 'Достык 2' },
  { id: 'holiday_inn',   name: 'Holiday Inn',              address: 'Туран 44' },
  { id: 'hampton',       name: 'Hampton',                  address: 'Мангилик ел 43а' },
  { id: 'hilton_astana', name: 'Hilton Astana',            address: 'Гейдар Алиева 14' },
  { id: 'wyndham',       name: 'Wyndham',                  address: 'Хусейн бен Талал 25' },
  { id: 'mirotel',       name: 'Миротель',                 address: 'Аркат' },
  { id: 'kazzhol',       name: 'Kazzhol',                  address: 'Балкантау 213' },
  { id: 'ibis',          name: 'Ibis',                     address: 'Тауелсиздик 38' },
  { id: 'alanda',        name: 'Alanda',                   address: 'Тауелсиздик 33' }
];
const DAYS = [
  ['2026-10-24','24 октября','суббота'], ['2026-10-25','25 октября','воскресенье'], ['2026-10-26','26 октября','понедельник'],
  ['2026-10-27','27 октября','вторник'], ['2026-10-28','28 октября','среда'],       ['2026-10-29','29 октября','четверг'],
  ['2026-10-30','30 октября','пятница'], ['2026-10-31','31 октября','суббота'],     ['2026-11-01','1 ноября','воскресенье']
].map(([date,label,wd]) => ({ date, label, wd }));
const DEPARTURE = [
  { id: 'residence',  label: 'Место проживания' },
  { id: 'university', label: 'Университет' }
];
const STATUS = { not_started:'Анкета не заполнена', submitted:'Анкета заполнена', reviewing:'Проверяется', confirmed:'Подтверждён', assigned:'Назначен', reserve:'Резерв', declined:'Не участвует' };

/* =====================================================================
   Telegram и API
   ===================================================================== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#FFFFFF'); tg.setBackgroundColor('#F3F5F8'); } catch (e) {} }

let mockDb = null;
async function api(action, data) {
  const initData = (tg && tg.initData) || '';
  if (!initData) {
    if (CONFIG.DEV_MODE) return mockApi(action, data);
    throw new Error('no_telegram');
  }
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, initData, data: data || {} })
  });
  if (!res.ok) throw new Error('http_' + res.status);
  const j = await res.json();
  if (!j || !j.ok) throw new Error((j && j.error) || 'server');
  return j;
}
async function mockApi(action, data) {
  await new Promise(r => setTimeout(r, 500));
  if (action === 'get') return { ok: true, volunteer: mockDb ? mockDb.volunteer : null, availability: mockDb ? mockDb.availability : [] };
  const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
  const volunteer = {
    full_name: data.full_name, phone: data.phone, date_of_birth: data.dob, residence_address: data.address,
    emergency_contact_name: data.ec_name, emergency_contact_phone: data.ec_phone,
    departure_point: data.departure_point_label, selected_hotel: data.hotel_name, final_comment: data.final_note,
    sop_confirmation: 'да', status: 'submitted', last_updated: now
  };
  const availability = DAYS.map(d => ({ date: d.date, available: data.days.includes(d.date) ? 'да' : 'нет', special_notes: data.notes }));
  mockDb = { volunteer, availability };
  return { ok: true, volunteer };
}

/* =====================================================================
   Состояние
   ===================================================================== */
const blank = () => ({ full_name:'', phone:'', dob:'', address:'', ec_name:'', ec_phone:'', departure_point:'', hotel_ids:[], days:{}, notes:'', final_note:'', sop:false });
const S = { screen:'loading', form:blank(), draft:null, tried:{}, registered:false, volunteer:null, saving:false, fromReview:false, banner:false, error:'', saveError:'' };

const isEdit = () => S.screen === 'editProfile' || S.screen === 'editAvail';
const cur = () => isEdit() ? S.draft : S.form;
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const yes = v => v === true || v === 'да' || v === 'TRUE' || v === 'true';

/* ---------- форматирование ---------- */
function fmtPhone(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (!d) return '';
  if (d[0] === '8') d = '7' + d.slice(1);
  if (d[0] !== '7') return '+' + d.slice(0, 15);
  d = d.slice(0, 11);
  let o = '+7';
  if (d.length > 1) o += ' ' + d.slice(1, 4);
  if (d.length > 4) o += ' ' + d.slice(4, 7);
  if (d.length > 7) o += ' ' + d.slice(7, 9);
  if (d.length > 9) o += ' ' + d.slice(9, 11);
  return o;
}
function fmtDate(v) {
  const d = String(v || '').replace(/\D/g, '').slice(0, 8);
  if (d.length > 4) return d.slice(0, 2) + '.' + d.slice(2, 4) + '.' + d.slice(4);
  if (d.length > 2) return d.slice(0, 2) + '.' + d.slice(2);
  return d;
}
function parseDob(s) {
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s || '');
  if (!m) return { fmt: false };
  const dd = +m[1], mm = +m[2], yy = +m[3], dt = new Date(yy, mm - 1, dd);
  if (dt.getFullYear() !== yy || dt.getMonth() !== mm - 1 || dt.getDate() !== dd) return { fmt: true, ok: false };
  return { fmt: true, ok: true, date: dt, iso: m[3] + '-' + m[2] + '-' + m[1] };
}
const isoToDob = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] : ''; };
const countDays = o => Object.keys(o || {}).filter(k => o[k]).length;

/* ---------- валидация ---------- */
function validatePersonal(f) {
  const e = {};
  const name = f.full_name.trim();
  if (!name) e.full_name = 'Укажите ФИО';
  else if (name.split(/\s+/).length < 2) e.full_name = 'Укажите фамилию и имя полностью';
  const pd = f.phone.replace(/\D/g, '');
  if (!pd) e.phone = 'Укажите номер телефона';
  else if (pd.length < 11) e.phone = 'Номер слишком короткий. Пример: +7 701 234 56 78';
  if (!f.dob) e.dob = 'Укажите дату рождения';
  else {
    const r = parseDob(f.dob);
    if (!r.fmt) e.dob = 'Введите дату в формате ДД.ММ.ГГГГ';
    else if (!r.ok) e.dob = 'Такой даты не существует';
    else if (r.date > new Date() || r.date.getFullYear() < 1940) e.dob = 'Проверьте год рождения';
  }
  if (!f.address.trim()) e.address = 'Укажите адрес проживания';
  if (!f.ec_name.trim()) e.ec_name = 'Укажите имя контактного лица';
  const ep = f.ec_phone.replace(/\D/g, '');
  if (!ep) e.ec_phone = 'Укажите номер контактного лица';
  else if (ep.length < 11) e.ec_phone = 'Номер слишком короткий';
  else if (ep === pd) e.ec_phone = 'Укажите номер другого человека, не ваш';
  return e;
}

/* ---------- данные из таблицы → форма ---------- */
function fromRecord(v, avail) {
  const f = blank();
  if (!v) return f;
  f.full_name = v.full_name || '';
  f.phone = fmtPhone(v.phone);
  f.dob = isoToDob(v.date_of_birth);
  f.address = v.residence_address || '';
  f.ec_name = v.emergency_contact_name || '';
  f.ec_phone = fmtPhone(v.emergency_contact_phone);
  const dep = DEPARTURE.find(d => d.id === v.departure_point || d.label === v.departure_point);
  f.departure_point = dep ? dep.id : '';
  const saved = String(v.selected_hotel || '').split(',').map(x => x.trim()).filter(Boolean);
  f.hotel_ids = HOTELS.filter(x => saved.includes(x.name) || saved.includes(x.id)).map(x => x.id);
  f.final_note = v.final_comment || '';
  f.sop = yes(v.sop_confirmation);
  (avail || []).forEach(r => { if (yes(r.available)) f.days[r.date] = true; if (r.special_notes && !f.notes) f.notes = r.special_notes; });
  return f;
}
function toPayload(f) {
  const dep = DEPARTURE.find(d => d.id === f.departure_point);
  const names = HOTELS.filter(x => f.hotel_ids.includes(x.id)).map(x => x.name);
  return {
    full_name: f.full_name.trim(), phone: f.phone, dob: parseDob(f.dob).iso, address: f.address.trim(),
    ec_name: f.ec_name.trim(), ec_phone: f.ec_phone,
    departure_point: f.departure_point, departure_point_label: dep ? dep.label : '',
    hotel_ids: f.hotel_ids, hotel_name: names.join(', '),
    days: DAYS.filter(d => f.days[d.date]).map(d => d.date),
    notes: f.notes.trim(), final_note: f.final_note.trim(), sop: !!f.sop
  };
}

/* =====================================================================
   Действия
   ===================================================================== */
function go(screen, extra) { Object.assign(S, { screen }, extra || {}); render(true); }
function setField(k, v, rerender) { cur()[k] = v; if (rerender) render(false); }

async function load() {
  S.screen = 'loading'; render(true);
  try {
    const r = await api('get');
    const v = r.volunteer;
    if (v && v.status && v.status !== 'not_started') {
      S.registered = true; S.volunteer = v; S.form = fromRecord(v, r.availability); S.screen = 'home';
    } else { S.screen = 'welcome'; }
  } catch (e) {
    S.error = e.message === 'no_telegram' ? 'no_telegram' : 'load'; S.screen = 'error';
  }
  render(true);
}
function next() {
  const f = S.form, sc = S.screen;
  if (sc === 'personal' && Object.keys(validatePersonal(f)).length) { S.tried.personal = true; render(true); return; }
  if (sc === 'departure' && !(f.departure_point && f.hotel_ids.length)) return;
  if (sc === 'availability' && !countDays(f.days)) return;
  if (sc === 'terms' && !f.sop) return;
  if (S.fromReview) { go('review', { fromReview: false }); return; }
  const order = ['personal', 'departure', 'availability', 'terms', 'review'];
  go(order[order.indexOf(sc) + 1]);
}
function back() {
  const sc = S.screen;
  if (S.fromReview && ['personal', 'departure', 'availability'].includes(sc)) { go('review', { fromReview: false }); return; }
  const map = { personal: S.registered ? 'home' : 'welcome', departure: 'personal', availability: 'departure', terms: 'availability', review: 'terms' };
  go(map[sc] || 'home', { draft: null, tried: {} });
}
async function submit() {
  if (S.saving) return;                  // защита от двойного нажатия
  S.saving = true; S.saveError = ''; render(false);
  try {
    const r = await api('save', toPayload(S.form));
    S.registered = true; S.volunteer = Object.assign({}, S.volunteer || {}, r.volunteer || {});
    S.saving = false; go('success', { fromReview: false });
  } catch (e) {
    S.saving = false; S.saveError = 'Не удалось отправить анкету. Проверьте интернет и попробуйте ещё раз.'; render(false);
  }
}
function openEdit(screen) { go(screen, { draft: clone(S.form), tried: {}, banner: false, saveError: '' }); }
async function saveEdit() {
  if (S.saving) return;
  const d = S.draft;
  if (S.screen === 'editProfile' && (Object.keys(validatePersonal(d)).length || !d.departure_point || !d.hotel_ids.length)) { S.tried.edit = true; render(true); return; }
  if (S.screen === 'editAvail' && !countDays(d.days)) return;
  S.saving = true; S.saveError = ''; render(false);
  try {
    const r = await api('save', toPayload(d));
    S.form = d; S.volunteer = Object.assign({}, S.volunteer || {}, r.volunteer || {});
    S.saving = false; go('home', { draft: null, banner: true, tried: {} });
  } catch (e) {
    S.saving = false; S.saveError = 'Не удалось сохранить. Проверьте интернет и попробуйте ещё раз.'; render(false);
  }
}
function contact() {
  const t = CONFIG.COORDINATOR.telegram;
  if (!t) return;
  const url = 'https://t.me/' + t.replace(/^@/, '');
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
}

/* =====================================================================
   Разметка
   ===================================================================== */
const I = {
  back: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A93A3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  tick: (s, w) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,

  chat: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/></svg>',
  clock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  phone: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  alert: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>',
  infoI: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5h.01"/></svg>',
  shield: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M12 8v4.5M12 16h.01"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

function field(id, key, label, attrs, errs, tried) {
  const f = cur(); const bad = tried && errs[key];
  return `<div class="col g6"><label for="${id}" class="lbl">${label} <span class="req">*</span></label>
    <input id="${id}" class="inp${bad ? ' bad' : ''}" data-field="${key}" value="${esc(f[key])}" ${attrs}>
    ${bad ? `<div class="err">${esc(errs[key])}</div>` : ''}</div>`;
}

function personalBlock(editMode) {
  const f = cur(); const tried = editMode ? S.tried.edit : S.tried.personal; const e = validatePersonal(f);
  return `<div class="col g16">
    ${editMode ? '<h2 class="h2">Основные данные</h2>' : ''}
    <div class="muted" style="font-size:13px;font-weight:600"><span class="req">*</span> — обязательное поле</div>
    ${field('f-name', 'full_name', 'ФИО', 'type="text" autocomplete="name" placeholder="Иванова Анастасия Сергеевна"', e, tried)}
    ${field('f-phone', 'phone', 'Номер телефона', 'type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 701 234 56 78" data-mask="phone"', e, tried)}
    ${field('f-dob', 'dob', 'Дата рождения', 'type="text" inputmode="numeric" placeholder="ДД.ММ.ГГГГ" maxlength="10" data-mask="date"', e, tried)}
    ${field('f-addr', 'address', 'Адрес проживания', 'type="text" autocomplete="street-address" placeholder="Город, улица, дом, квартира"', e, tried)}
    <div class="card col g14">
      <div class="row g10" style="align-items:flex-start"><div class="ico" style="width:36px;height:36px;border-radius:10px;background:#FDF0E6;color:#A44A12">${I.phone}</div>
      <div style="font-weight:800;font-size:15px;line-height:1.35;padding-top:1px">Контактное лицо на случай экстренной ситуации</div></div>
      ${field('f-ecn', 'ec_name', 'Имя', 'type="text" placeholder="Например: Иванова Мария"', e, tried)}
      ${field('f-ecp', 'ec_phone', 'Номер телефона', 'type="tel" inputmode="tel" placeholder="+7 7XX XXX XX XX" data-mask="phone"', e, tried)}
    </div></div>`;
}

function departureBlock(editMode) {
  const f = cur();
  const opts = DEPARTURE.map(o => {
    const on = f.departure_point === o.id; const sub = o.id === 'residence' ? f.address.trim() : '';
    return `<label class="opt${on ? ' on' : ''}"><input type="radio" name="dep" data-pick="departure_point" value="${o.id}" ${on ? 'checked' : ''}>
      <span class="radio"><i></i></span><span class="col" style="flex:1;gap:2px;min-width:0"><span class="opt-t">${o.label}</span>
      ${sub ? `<span class="opt-s" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sub)}</span>` : ''}</span></label>`;
  }).join('');
  const hotels = !f.departure_point ? '' : `<div class="col g12" style="padding-top:6px">
    <div class="col g6"><h2 class="h2">Ближайшие отели</h2><p class="muted" style="margin:0;font-size:14px;line-height:1.45;font-weight:600">Отметьте один или несколько отелей, которые находятся рядом с выбранной вами точкой отправления.</p></div>
    <div class="info">${I.infoI}<span>Это не значит, что вы будете работать с делегацией из этого отеля: расселение команд определяют федерация и организаторы. Нам это нужно как ориентир — кто из волонтёров живёт рядом и сможет быстро подъехать, если понадобится срочная помощь.</span></div>
    <div class="row between g12"><span style="font-weight:800;font-size:15px">Отели</span><span class="chip${f.hotel_ids.length ? ' on' : ''}">Выбрано: ${f.hotel_ids.length}</span></div>
    <div class="col g8">${HOTELS.map(h => {
      const on = f.hotel_ids.includes(h.id);
      return `<label class="opt${on ? ' on' : ''}" style="min-height:54px;padding:12px 16px"><input type="checkbox" data-hotel="${h.id}" ${on ? 'checked' : ''}>
        <span class="col" style="flex:1;gap:2px"><span class="opt-t">${esc(h.name)}</span>${h.address ? `<span class="opt-s">${esc(h.address)}</span>` : ''}</span><span class="check">${I.tick(14, 3.2)}</span></label>`;
    }).join('')}</div></div>`;
  const missing = editMode && S.tried.edit && !(f.departure_point && f.hotel_ids.length);
  return `<div class="col g12">
    ${editMode ? '<h2 class="h2" style="margin-top:8px">Откуда вам в основном будет удобнее добираться?</h2>' : ''}
    <div class="info">${I.infoI}<span>Выберите основную точку отправления, на которую мы будем ориентироваться при распределении. Если в отдельные дни вам будет удобнее добираться из другого места, сообщите об этом координатору.</span></div>
    ${missing ? '<div class="err">Выберите точку отправления и хотя бы один отель</div>' : ''}
    <div role="radiogroup" aria-label="Основная точка отправления" class="col g10">${opts}</div></div>${hotels}`;
}

function availBlock() {
  const f = cur(); const n = countDays(f.days);
  return `<div class="col g12">
    <div class="row between g12"><span style="font-weight:800;font-size:15px">24 октября — 1 ноября</span><span class="chip${n ? ' on' : ''}" id="daycount">Выбрано: ${n} из 9</span></div>
    <div class="col g8">${DAYS.map(d => {
      const on = !!f.days[d.date];
      return `<label class="opt${on ? ' on' : ''}" style="min-height:60px;padding:10px 16px"><input type="checkbox" data-day="${d.date}" ${on ? 'checked' : ''}>
        <span class="col" style="flex:1;gap:1px"><span style="font-weight:800;font-size:16px">${d.label}</span><span class="opt-s">${d.wd}</span></span>
        <span class="time">07:30–20:00</span><span class="check">${I.tick(14, 3.2)}</span></label>`;
    }).join('')}</div></div>
    <div class="card col g10">
      <div class="row between" style="align-items:baseline;gap:8px"><label for="f-notes" class="h2" style="font-size:16px">Есть особые обстоятельства?</label><span class="muted" style="font-size:12px;font-weight:700">необязательно</span></div>
      <p class="muted" style="margin:0;font-size:14px;line-height:1.45;font-weight:600">Если в отдельные дни вам нужно отойти на несколько часов или вы можете работать только часть дня, напишите здесь, в какие дни и в какое время вы будете доступны.</p>
      <textarea id="f-notes" class="inp ta" data-field="notes" placeholder="Например:&#10;26 октября могу быть с 12:00 до 20:00.&#10;30 октября мне нужно уйти с 15:00 до 17:00.">${esc(f.notes)}</textarea>
    </div>`;
}

function groupDays(f) {
  const by = {}, order = [];
  DAYS.forEach(d => { if (!f.days[d.date]) return; const [n, m] = d.label.split(' '); if (!by[m]) { by[m] = []; order.push(m); } by[m].push(n); });
  return order.map(m => by[m].join(', ') + ' ' + m).join('; ');
}

function screenBody() {
  const f = cur(), sc = S.screen;
  switch (sc) {
    case 'loading':
      return `<div class="center"><div class="spin"></div><div class="muted" style="font-weight:600">Загрузка…</div></div>`;
    case 'error':
      return `<div class="center"><h1>${S.error === 'no_telegram' ? 'Откройте анкету в Telegram' : 'Не удалось загрузить данные'}</h1>
        <p class="muted" style="margin:0;font-size:15px;line-height:1.5;font-weight:600">${S.error === 'no_telegram' ? 'Эта страница работает только внутри бота волонтёров СОП.' : 'Проверьте интернет и попробуйте ещё раз. Если ошибка повторяется, напишите координатору.'}</p></div>`;
    case 'welcome':
      return `<div class="col" style="gap:28px;padding-top:12px">
        <div class="row g12"><div class="logo">СОП</div><div class="col" style="gap:2px"><span style="font-weight:800;font-size:16px">SOP Volunteer Bot</span><span class="muted" style="font-size:13px;font-weight:600">СОП | Волонтёры ЧМ по борьбе</span></div></div>
        <div class="col g12" style="padding-top:24px"><h1 class="h1-big">Добро пожаловать в систему волонтёров СОП</h1>
        <p class="muted" style="margin:0;font-size:16px;line-height:1.5">Пожалуйста, заполните информацию о себе и укажите дни, когда вы сможете участвовать в проекте.</p></div>
        <div class="card col g14">
          <div class="row g12"><div class="ico" style="width:40px;height:40px">${I.team}</div><div class="col" style="gap:2px"><span class="k">Направление</span><span class="v">Сопровождение делегаций и команд</span></div></div>
          <div class="row g12"><div class="ico" style="width:40px;height:40px">${I.cal}</div><div class="col" style="gap:2px"><span class="k">Период соревнований</span><span class="v">24 октября — 1 ноября</span></div></div>
          <div class="row g12"><div class="ico" style="width:40px;height:40px">${I.clock}</div><div class="col" style="gap:2px"><span class="k">Рабочий день</span><span class="v">07:30–20:00</span></div></div>
        </div></div>`;
    case 'home': {
      const first = (S.form.full_name.trim().split(/\s+/)[1]) || '';
      const st = STATUS[(S.volunteer && S.volunteer.status) || 'submitted'] || 'Анкета заполнена';
      const upd = S.volunteer && S.volunteer.last_updated ? 'Последнее изменение: ' + esc(S.volunteer.last_updated) : '';
      return `<div class="col g18" style="padding-top:4px">
        <div class="row g12"><div class="logo" style="width:40px;height:40px;font-size:12px">СОП</div><div class="col" style="gap:1px"><span style="font-weight:800;font-size:15px">SOP Volunteer Bot</span><span class="muted" style="font-size:13px;font-weight:600">СОП | Волонтёры ЧМ по борьбе</span></div></div>
        <h1 style="margin-top:6px;font-size:27px">${first ? 'Здравствуйте, ' + esc(first) + '!' : 'Здравствуйте!'}</h1>
        ${S.banner ? `<div class="okbanner" role="status"><div class="okdot">${I.tick(16, 3)}</div>
          <div class="col" style="flex:1;gap:3px;padding-top:3px"><span style="font-weight:800;font-size:15px;color:#13573A">Данные обновлены.</span><span style="font-size:14px;line-height:1.4;color:#1D4A35">Пожалуйста, сообщите об изменении своему координатору.</span></div>
          <button class="iconbtn" data-act="closeBanner" aria-label="Закрыть уведомление" style="margin:-8px -4px 0 0;color:#1D4A35">${I.x}</button></div>` : ''}
        <div class="card col g10" style="padding:16px 18px"><div class="row between g12"><span class="k">Статус анкеты</span><span class="chip ok">${I.tick(14, 3)}${esc(st)}</span></div>
          ${upd ? `<div class="muted" style="font-size:13px;font-weight:600">${upd}</div>` : ''}</div>
        <div class="col g10">
          <button class="menu" data-act="editProfile"><div class="ico">${I.user}</div><div class="col" style="flex:1;gap:3px"><span style="font-weight:800;font-size:16px">Мои данные</span><span class="muted" style="font-size:13px;font-weight:600">Контакты, точка отправления, отели</span></div>${I.chev}</button>
          <button class="menu" data-act="editAvail"><div class="ico">${I.cal}</div><div class="col" style="flex:1;gap:3px"><span style="font-weight:800;font-size:16px">Моя доступность</span><span class="muted" style="font-size:13px;font-weight:600">Выбрано дней: ${countDays(S.form.days)} из 9</span></div>${I.chev}</button>
          <button class="menu" data-act="assign"><div class="ico grey">${I.team}</div><div class="col" style="flex:1;gap:3px"><span style="font-weight:800;font-size:16px">Мои назначения</span><span class="muted" style="font-size:13px;font-weight:600">Появятся после распределения</span></div><span class="chip" style="height:24px;font-size:12px">Скоро</span></button>
        </div></div>`;
    }
    case 'personal': return personalBlock(false);
    case 'departure': return departureBlock(false);
    case 'availability': return availBlock();
    case 'terms':
      return `<div class="col g14"><div class="card terms col g14">
        <div class="row g10"><div class="ico" style="width:40px;height:40px;background:#FCEFD2;color:#8A5A00">${I.shield}</div><h2 class="h2">Важно о работе СОП</h2></div>
        <p>Вы будете закреплены за определённой командой/делегацией и должны оставаться с ней на связи в течение периода работы.</p>
        <p>Если вам необходимо отойти от команды даже на некоторое время, необходимо заранее сообщить об этом координатору.</p>
        <p style="font-weight:700">Пожалуйста, учитывайте это при выборе дней своей доступности.</p></div>
        <label class="opt${f.sop ? ' on' : ''}" style="align-items:flex-start;padding:16px"><input type="checkbox" data-toggle="sop" ${f.sop ? 'checked' : ''}>
          <span class="check" style="margin-top:1px">${I.tick(14, 3.2)}</span><span style="flex:1;font-size:15px;font-weight:700;line-height:1.45">Да, я ознакомлен(а) и согласен(на) с условиями работы СОП. <span class="req">*</span></span></label></div>`;
    case 'review': {
      const hn = HOTELS.filter(x => f.hotel_ids.includes(x.id)).map(x => x.name); const dep = DEPARTURE.find(x => x.id === f.departure_point);
      const sec = (title, act, rows) => `<div class="card col g12" style="padding:14px 18px 18px"><div class="row between g8"><h2 class="h2" style="font-size:16px">${title}</h2><button class="link" data-act="${act}">Изменить</button></div>
        ${rows.map(([k, v]) => `<div class="col" style="gap:3px"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>`;
      return `<div class="col g12">
        ${sec('Личные данные', 'fixPersonal', [['ФИО', f.full_name], ['Телефон', f.phone], ['Дата рождения', f.dob], ['Адрес проживания', f.address]])}
        ${sec('Экстренный контакт', 'fixPersonal', [['Контактное лицо', f.ec_name + '\n' + f.ec_phone]])}
        ${sec('Дорога', 'fixDeparture', [['Основная точка отправления', dep ? dep.label : '—'], ['Ближайшие отели', hn.length ? hn.join(', ') : '—']])}
        ${sec('Доступность', 'fixAvail', [['Дни доступности (' + countDays(f.days) + ') · 07:30–20:00', groupDays(f) || '—'], ['Дополнительные ограничения по времени', f.notes.trim() || 'Нет']])}
        <div class="card col g10">
          <div class="row between" style="align-items:baseline;gap:8px"><label for="f-final" class="h2" style="font-size:16px">Хотите что-то добавить?</label><span class="muted" style="font-size:12px;font-weight:700">необязательно</span></div>
          <p class="muted" style="margin:0;font-size:14px;line-height:1.45;font-weight:600">Если в какие-то дни вы не сможете работать или вам нужно отойти на несколько часов, напишите об этом здесь. Например: «28 октября мне нужно отойти на 2 часа в университет».</p>
          <textarea id="f-final" class="inp ta" data-field="final_note" placeholder="Ваш комментарий">${esc(f.final_note)}</textarea>
        </div>
        ${S.saveError ? `<div class="banner-err" role="alert">${I.alert}<span>${esc(S.saveError)}</span></div>` : ''}</div>`;
    }
    case 'success':
      return `<div class="center"><div style="width:88px;height:88px;border-radius:50%;background:#E7F5EE;display:flex;align-items:center;justify-content:center"><div style="width:64px;height:64px;border-radius:50%;background:#1E7F4F;color:#fff;display:flex;align-items:center;justify-content:center">${I.tick(34, 2.8)}</div></div>
        <h1 style="margin-top:6px;font-size:26px">Анкета успешно отправлена</h1>
        <p style="margin:0;font-size:16px;line-height:1.5;font-weight:700">Спасибо! Ваши данные сохранены.</p>
        <p class="muted" style="margin:0;font-size:15px;line-height:1.5;font-weight:600;max-width:320px">Если ваши планы или доступность изменятся, обязательно внесите изменения в боте и сообщите об этом своему координатору.</p></div>`;
    case 'editProfile':
      return personalBlock(true) + departureBlock(true) + (S.saveError ? `<div class="banner-err" role="alert">${I.alert}<span>${esc(S.saveError)}</span></div>` : '');
    case 'editAvail':
      return availBlock() + (S.saveError ? `<div class="banner-err" role="alert">${I.alert}<span>${esc(S.saveError)}</span></div>` : '');
    case 'assign':
      return `<div class="card col" style="align-items:center;text-align:center;gap:12px;padding:36px 22px"><div class="ico grey" style="width:56px;height:56px;border-radius:16px">${I.team}</div>
        <h2 class="h2">Назначений пока нет</h2><p class="muted" style="margin:0;font-size:15px;line-height:1.5;font-weight:600">Когда координатор закрепит вас за командой или делегацией, информация появится здесь.</p></div>`;
    case 'contact': {
      const c = CONFIG.COORDINATOR;
      return `<div class="col g14"><div class="card col g16">
        <div class="row g14"><div style="width:52px;height:52px;border-radius:50%;background:#EAF0FD;color:#1F5BD8;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px">${esc((c.name.replace(/[\[\]]/g, '') || 'К')[0])}</div>
        <div class="col" style="gap:2px"><span style="font-weight:800;font-size:16px">${esc(c.name)}</span><span class="muted" style="font-size:13px;font-weight:600">Координатор направления СОП</span></div></div>
        <div style="height:1px;background:#E6EAF0"></div>
        ${c.telegram ? `<div class="col" style="gap:3px"><span class="k">Telegram</span><span class="v">@${esc(c.telegram.replace(/^@/, ''))}</span></div>` : ''}
        ${c.phone ? `<div class="col" style="gap:3px"><span class="k">Телефон</span><a class="v" style="color:#1F4FB8" href="tel:${esc(c.phone.replace(/[^\d+]/g, ''))}">${esc(c.phone)}</a></div>` : ''}
        </div><p class="muted" style="margin:0;font-size:14px;line-height:1.5;font-weight:600">Если изменились ваши планы, сначала обновите данные в разделе «Моя доступность», а затем напишите координатору.</p></div>`;
    }
  }
  return '';
}

const STEP = { personal: 1, departure: 2, availability: 3, terms: 4, review: 5 };
const INTRO = {
  personal: ['1. Ваши данные', 'Пожалуйста, заполните основную информацию о себе.'],
  departure: ['2. Откуда вам удобнее добираться', 'Откуда вам в основном будет удобнее добираться во время соревнований?'],
  availability: ['3. Ваша доступность', 'Выберите дни, когда вы сможете работать.'],
  terms: ['4. Условия работы СОП', 'Пожалуйста, прочитайте перед отправкой анкеты.'],
  review: ['Проверьте данные', 'Если что-то указано неверно, нажмите «Изменить».'],
  editProfile: ['Мои данные', 'Измените нужные поля и сохраните.'],
  editAvail: ['Моя доступность', 'Отметьте дни, когда вы сможете работать.'],
  assign: ['Мои назначения', ''],
  contact: ['Связаться с координатором', '']
};

function footer() {
  const sc = S.screen, f = cur(), step = STEP[sc];
  const btn = (label, act, disabled) => `<button class="btn btn-p" data-act="${act}" ${disabled ? 'disabled' : ''}>${label}</button>`;
  const hint = t => `<div class="muted" style="font-size:13px;font-weight:700;text-align:center">${t}</div>`;
  if (sc === 'welcome') return btn('Заполнить анкету', 'start');
  if (step && step <= 4) {
    let h = '';
    if (sc === 'departure' && !(f.departure_point && f.hotel_ids.length)) h = !f.departure_point ? 'Выберите точку отправления' : 'Выберите хотя бы один отель';
    if (sc === 'availability' && !countDays(f.days)) h = 'Отметьте хотя бы один день';
    if (sc === 'terms' && !f.sop) h = 'Подтвердите, что ознакомились с условиями';
    return (h ? hint(h) : '') + btn(S.fromReview ? 'Сохранить и вернуться к проверке' : 'Далее', 'next', !!h);
  }
  if (sc === 'review') return btn(S.saving ? 'Отправляем…' : 'Подтвердить и отправить', 'submit', S.saving) + (S.saving ? '' : '<button class="btn btn-s" data-act="fixPersonal">Изменить</button>');
  if (sc === 'success') return btn('Вернуться в главное меню', 'home');
  if (sc === 'editProfile' || sc === 'editAvail') {
    const dirty = JSON.stringify(S.draft) !== JSON.stringify(S.form);
    const noDays = sc === 'editAvail' && !countDays(f.days);
    return (noDays ? hint('Отметьте хотя бы один день') : '') + btn(S.saving ? 'Сохраняем…' : 'Сохранить изменения', 'saveEdit', S.saving || !dirty || noDays);
  }
  if (sc === 'contact' && CONFIG.COORDINATOR.telegram) return btn('Написать координатору', 'write');
  if (sc === 'error') return btn('Попробовать снова', 'reload');
  return '';
}

function render(scrollTop) {
  const sc = S.screen, step = STEP[sc] || 0, it = INTRO[sc];
  const main = document.querySelector('main');
  const keep = main && !scrollTop ? main.scrollTop : 0;
  const showHdr = !['welcome', 'home', 'success', 'loading', 'error'].includes(sc);
  const e = sc === 'personal' ? validatePersonal(S.form) : sc === 'editProfile' ? validatePersonal(S.draft) : {};
  const tried = sc === 'personal' ? S.tried.personal : sc === 'editProfile' ? S.tried.edit : false;
  const errBanner = tried && (Object.keys(e).length || (sc === 'editProfile' && !(S.draft.departure_point && S.draft.hotel_ids.length)));
  const ft = footer();
  document.getElementById('app').innerHTML =
    (showHdr ? `<header class="hdr"><div class="hdr-row"><button class="iconbtn" data-act="back" aria-label="Назад">${I.back}</button>
      <div class="hdr-title">${step ? 'Анкета волонтёра' : 'Главное меню'}</div>${step ? `<div class="step">Шаг ${step} из 5</div>` : ''}</div>
      ${step ? `<div class="segs" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<div class="seg${i <= step ? ' on' : ''}"></div>`).join('')}</div>` : ''}</header>` : '') +
    `<main>${it ? `<div><h1>${it[0]}</h1>${it[1] ? `<p class="sub">${it[1]}</p>` : ''}</div>` : ''}
      ${errBanner ? `<div class="banner-err" role="alert">${I.alert}<span>Проверьте отмеченные поля — они обязательны для заполнения.</span></div>` : ''}
      ${screenBody()}</main>` +
    (ft ? `<footer class="ftr">${ft}</footer>` : '');
  document.querySelector('main').scrollTop = keep;
}

/* ---------- события ---------- */
const app = document.getElementById('app');
app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'start') { if (S.registered) go('home'); else go('personal', { tried: {} }); }
  else if (a === 'next') next();
  else if (a === 'back') back();
  else if (a === 'submit') submit();
  else if (a === 'home') go('home', { banner: false });
  else if (a === 'fixPersonal') go('personal', { fromReview: true });
  else if (a === 'fixDeparture') go('departure', { fromReview: true });
  else if (a === 'fixAvail') go('availability', { fromReview: true });
  else if (a === 'editProfile' || a === 'editAvail') openEdit(a);
  else if (a === 'saveEdit') saveEdit();
  else if (a === 'assign' || a === 'contact') go(a, { banner: false });
  else if (a === 'closeBanner') { S.banner = false; render(false); }
  else if (a === 'write') contact();
  else if (a === 'reload') load();
});
app.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.field) {
    let v = t.value;
    if (t.dataset.mask === 'phone') { v = fmtPhone(v); t.value = v; }
    if (t.dataset.mask === 'date') { v = fmtDate(v); t.value = v; }
    setField(t.dataset.field, v, false);
    refreshFooter();
  }
});
app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.pick) { setField(t.dataset.pick, t.value, true); }
  else if (t.dataset.hotel) { const id = t.dataset.hotel; const arr = cur().hotel_ids.slice(); const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else arr.push(id); setField('hotel_ids', arr, true); }
  else if (t.dataset.day) { const d = Object.assign({}, cur().days); if (d[t.dataset.day]) delete d[t.dataset.day]; else d[t.dataset.day] = true; setField('days', d, true); }
  else if (t.dataset.toggle) { setField(t.dataset.toggle, !cur()[t.dataset.toggle], true); }
});
// после ввода текста обновляем только нижнюю панель (кнопка «Сохранить» и т.п.), не трогая поле с курсором
function refreshFooter() { const f = document.querySelector('.ftr'); if (f) f.innerHTML = footer(); }

load();
</script>
</body>
</html>
